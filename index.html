<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content</title>
  <link rel="stylesheet" href="fonts/abc-rom.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: "ABC ROM", sans-serif;
      font-weight: 500;
    }

    .content-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      min-height: max(100svh, 376px);
    }

    .circles {
      position: absolute;
      top: 32px;
      left: 32px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
      transform: scale(1.2);
      transform-origin: top left;
      z-index: 3;
    }

    .content-item {
      position: relative;
    }

    .item-label {
      font-weight: 500;
      text-align: left;
      font-size: 24px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .numbered-label {
      display: grid;
      grid-template-columns: 1ch auto;
      column-gap: 0.75em;
    }

    .circle {
      display: block;
      width: 17px;
      height: 17px;
      border: 2px solid #000;
      border-radius: 50%;
    }

    .corner-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 850px;
      background: transparent;

    }

    .frame-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 0 solid #000;
    }

    .top-left { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .top-right { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .bottom-left { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .bottom-right { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

    .frame-triangle {
      position: absolute;
      background: #000;
    }

    .triangle-top, .triangle-bottom {
      width: 25px;
      height: 21.650635px;
      left: 50%;
      transform: translateX(-50%);
    }

    .triangle-top {
      bottom: calc(100% + 20px);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .triangle-bottom {
      top: calc(100% + 20px);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .triangle-left, .triangle-right {
      width: 21.650635px;
      height: 25px;
      top: 50%;
      transform: translateY(-50%);
    }

    .triangle-left {
      right: calc(100% + 20px);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }

    .triangle-right {
      left: calc(100% + 20px);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    .directory-button {
      border: 0;
      padding: 0;
      background: none;
      display: grid;
      grid-template-columns: 17px auto;
      column-gap: calc(50px / 3);
      align-items: start;
    }
    .directory-button .circle { margin-top: calc((24px * 1.2 - 17px) / 2); }
    .directory-button[aria-current="page"] .circle,
    .directory-button:hover .circle,
    .directory-button:focus-visible .circle { background: #000; }
    .circle { transition: background-color 150ms ease; }
    .about-page {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: white;
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateY(-100%);
      visibility: hidden;
      transition: transform 500ms ease-in-out, visibility 0s 500ms;
    }
    .about-body {
      margin-left: 25%;
      width: 75%;
      padding: 32px 32px 32px 0;
      font-family: "ABC ROM", sans-serif;
      font-weight: 500;
      font-size: 10vw;
      line-height: 1.1;
      overflow-wrap: break-word;
    }
    .about-body p { margin: 0 0 1em; }
    .about-body p:last-child { margin-bottom: 0; }
    .content-page.is-about .about-page {
      transform: translateY(0);
      visibility: visible;
      transition-delay: 0s;
    }
    .content-page.is-about .section-entry { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) {
      .about-page, .circle { transition: none; }
    }
    .frame-triangle { border: 0; padding: 0; }
    .frame-triangle:disabled { opacity: .2; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 2px solid #777; outline-offset: 5px; }
    .page-viewport { position: absolute; inset: 0; overflow: hidden; }
    .page-content { position: absolute; inset: 0; background: transparent; height: 100%; padding: clamp(20px, 5vw, 56px); overflow: auto; }
    .frame-pagination { position: absolute; left: 10px; top: 10px; margin: 0; font-size: 18px; line-height: 1; display: flex; gap: 0.25em; }
    .page-number-window { position: relative; display: inline-block; width: 2ch; height: 1em; overflow: hidden; }
    .page-number-window span { position: absolute; inset: 0; font-variant-numeric: tabular-nums; }
    .page-body { position: relative; }
    .corner-frame {
      width: min(650px, calc(100vw - 120px), calc((100svh - 120px) * 650 / 850));
      height: auto;
      aspect-ratio: 650 / 850;
    }
    .content-page { min-height: max(100svh, 360px); }
    .circles.is-obscured .section-entry { visibility: hidden; }
    .section-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "ABC ROM", sans-serif;
      font-weight: 500;
      font-size: var(--section-number-size);
      line-height: 1;
      color: #bfbfbf;
      opacity: 0.25;
      pointer-events: none;
    }
    .section-number[data-number="1"] { transform: translateX(-5%); }
    @media (max-height: 359px) {
      .corner-frame { width: min(650px, calc(100vw - 120px), 183px); }
    }
  </style>
</head>
<body>
  <main class="content-page" aria-label="Content">
    <ul class="circles">
      <li class="content-item"><button class="directory-button view-toggle" aria-expanded="false" aria-controls="about-page"><span class="circle" aria-hidden="true"></span><span class="item-label">About</span></button></li>
      <li class="content-item section-entry"><button class="directory-button" data-page="0"><span class="circle" aria-hidden="true"></span><span class="item-label numbered-label"><span>1</span><span>Unicode</span></span></button></li>
      <li class="content-item section-entry"><button class="directory-button" data-page="1"><span class="circle" aria-hidden="true"></span><span class="item-label numbered-label"><span>2</span><span>_Self</span></span></button></li>
      <li class="content-item section-entry"><button class="directory-button" data-page="2"><span class="circle" aria-hidden="true"></span><span class="item-label numbered-label"><span>3</span><span>_Hexadecimal Code</span></span></button></li>
      <li class="content-item section-entry"><button class="directory-button" data-page="3"><span class="circle" aria-hidden="true"></span><span class="item-label numbered-label"><span>4</span><span>_Ideographic<br>Description Symbols</span></span></button></li>
      <li class="content-item section-entry"><button class="directory-button" data-page="4"><span class="circle" aria-hidden="true"></span><span class="item-label numbered-label"><span>5</span><span>_ Drafts</span></span></button></li>
    </ul>
    <section class="about-page" id="about-page" aria-label="About" aria-hidden="true" inert>
      <div class="about-body">
        <p>This website documents Yilin Shen’s ongoing exploration of Unicode.</p>
        <p>Begun in October 2024, the project examines the principles and algorithms underlying Unicode, while exploring how the medium itself shapes meaning. Both strands approach Unicode as a working language.</p>
      </div>
    </section>
    <div class="corner-frame">
      <div class="page-viewport">
      <div class="section-number" data-number="1" aria-hidden="true">1</div>
      <article class="page-content" aria-live="polite" aria-atomic="true">
        <div class="page-body"></div>
      </article>
      </div>
      <footer class="frame-pagination" aria-label="Section 1 of 5"><span class="page-number-window"><span id="page-number">01</span></span><span class="page-total">/05</span></footer>
      <span class="frame-corner top-left"></span>
      <span class="frame-corner top-right"></span>
      <span class="frame-corner bottom-left"></span>
      <span class="frame-corner bottom-right"></span>
      <button class="frame-triangle triangle-top" data-step="-1" aria-label="Previous section"></button>
      <button class="frame-triangle triangle-bottom" data-step="1" aria-label="Next section"></button>
      <button class="frame-triangle triangle-left" data-step="-1" aria-label="Previous content"></button>
      <button class="frame-triangle triangle-right" data-step="1" aria-label="Next content"></button>
    </div>
  </main>
<script>
    const titles = ['1 Unicode', '2 _Self', '3 _Hexadecimal Code', '4 _Ideographic Description Symbols', '5 _ Drafts'];
    // Replace each empty string with the content for that section's slide.
    const sections = titles.map(title => ({ title, slides: ['', ''] }));
    let currentPage = 0;
    let currentSlide = 0;
    function renderPage(index, slide = 0) {
      currentPage = Math.max(0, Math.min(titles.length - 1, index));
      currentSlide = Math.max(0, Math.min(sections[currentPage].slides.length - 1, slide));
      const number = document.querySelector('.section-number');
      number.textContent = currentPage + 1;
      number.dataset.number = currentPage + 1;
      document.querySelector('.page-body').textContent = sections[currentPage].slides[currentSlide];
      document.querySelector('.page-content').setAttribute('aria-label', `${titles[currentPage]}, content ${currentSlide + 1}`);
      document.getElementById('page-number').textContent = String(currentPage + 1).padStart(2, '0');
      document.querySelector('.frame-pagination').setAttribute('aria-label', `Section ${currentPage + 1} of 5`);
      document.querySelector('.page-content').scrollTop = 0;
      document.querySelectorAll('[data-page]').forEach(button => {
        if (Number(button.dataset.page) === currentPage) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      document.querySelectorAll('[data-step]').forEach(button => {
        const horizontal = button.classList.contains('triangle-left') || button.classList.contains('triangle-right');
        const position = horizontal ? currentSlide : currentPage;
        const count = horizontal ? sections[currentPage].slides.length : sections.length;
        button.disabled = Number(button.dataset.step) < 0 ? position === 0 : position === count - 1;
      });
    }
    let turning = false;
    async function showPage(index, direction, slide = 0) {
      const next = Math.max(0, Math.min(titles.length - 1, index));
      const nextSlide = Math.max(0, Math.min(sections[next].slides.length - 1, slide));
      if (turning || (next === currentPage && nextSlide === currentSlide)) return;
      direction ||= next > currentPage ? 'bottom' : 'top';
      const page = document.querySelector('.page-content');
      const pageNumber = document.getElementById('page-number');
      const changesSection = next !== currentPage;
      const previousNumber = pageNumber.textContent;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        renderPage(next, nextSlide);
        return;
      }
      const vectors = { right: [100, 0], left: [-100, 0], top: [0, -100], bottom: [0, 100] };
      const [x, y] = vectors[direction];
      const outgoing = page.cloneNode(true);
      outgoing.removeAttribute('aria-live');
      outgoing.setAttribute('aria-hidden', 'true');
      outgoing.inert = true;
      outgoing.removeAttribute('id');
      outgoing.querySelectorAll('[id]').forEach(element => element.removeAttribute('id'));
      page.parentElement.append(outgoing);
      outgoing.scrollTop = page.scrollTop;
      turning = true;
      const animations = [];
      let outgoingNumber;
      try {
        renderPage(next, nextSlide);
        const options = { duration: 500, easing: 'ease-in-out', fill: 'both' };
        animations.push(outgoing.animate([
          { transform: 'translate(0, 0)' },
          { transform: `translate(${-x}%, ${-y}%)` }
        ], options));
        animations.push(page.animate([
          { transform: `translate(${x}%, ${y}%)` },
          { transform: 'translate(0, 0)' }
        ], options));
        if (changesSection) {
          outgoingNumber = pageNumber.cloneNode(true);
          outgoingNumber.removeAttribute('id');
          outgoingNumber.setAttribute('aria-hidden', 'true');
          outgoingNumber.textContent = previousNumber;
          pageNumber.parentElement.append(outgoingNumber);
          animations.push(outgoingNumber.animate([
            { transform: 'translate(0, 0)' },
            { transform: `translate(${-x}%, ${-y}%)` }
          ], options));
          animations.push(pageNumber.animate([
            { transform: `translate(${x}%, ${y}%)` },
            { transform: 'translate(0, 0)' }
          ], options));
        }
        await Promise.all(animations.map(animation => animation.finished));
      } finally {
        outgoing.remove();
        outgoingNumber?.remove();
        animations.forEach(animation => animation.cancel());
        turning = false;
      }
    }
    function navigate(direction) {
      if (aboutOpen) return;
      if (direction === 'left' || direction === 'right') {
        showPage(currentPage, direction, currentSlide + (direction === 'left' ? -1 : 1));
      } else {
        showPage(currentPage + (direction === 'top' ? -1 : 1), direction, 0);
      }
    }
    document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => {
      const section = Number(button.dataset.page);
      if (section !== currentPage) showPage(section);
    }));
    document.querySelectorAll('[data-step]').forEach(button => button.addEventListener('click', () => {
      navigate(['top', 'bottom', 'left', 'right'].find(direction => button.classList.contains(`triangle-${direction}`)));
    }));
    document.addEventListener('keydown', event => {
      if (aboutOpen || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      const direction = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'top', ArrowDown: 'bottom' }[event.key];
      if (direction) {
        event.preventDefault();
        navigate(direction);
      }
    });
    let aboutOpen = false;
    const main = document.querySelector('.content-page');
    const about = document.querySelector('.about-page');
    const viewToggle = document.querySelector('.view-toggle');
    const frame = document.querySelector('.corner-frame');
    function toggleAbout() {
      if (turning) return;
      aboutOpen = !aboutOpen;
      main.classList.toggle('is-about', aboutOpen);
      main.setAttribute('aria-label', aboutOpen ? 'About' : 'Content');
      viewToggle.querySelector('.item-label').textContent = aboutOpen ? 'Content' : 'About';
      viewToggle.setAttribute('aria-expanded', String(aboutOpen));
      about.setAttribute('aria-hidden', String(!aboutOpen));
      about.inert = !aboutOpen;
      frame.inert = aboutOpen;
      frame.setAttribute('aria-hidden', String(aboutOpen));
      updateLayout();
    }
    viewToggle.addEventListener('click', toggleAbout);
    const directory = document.querySelector('.circles');
    function updateLayout() {
      const frameBounds = frame.getBoundingClientRect();
      frame.style.setProperty('--section-number-size', `${frameBounds.height * 0.96}px`);
      // Visibility preserves layout so hidden entries can still be measured.
      const overlaps = [...directory.querySelectorAll('.directory-button')].some(button => {
        const bounds = button.getBoundingClientRect();
        return bounds.right >= frameBounds.left && bounds.left <= frameBounds.right
          && bounds.bottom >= frameBounds.top && bounds.top <= frameBounds.bottom;
      });
      directory.classList.toggle('is-obscured', overlaps);
      directory.querySelectorAll('.section-entry').forEach(entry => { entry.inert = overlaps || aboutOpen; });
    }
    const layoutObserver = new ResizeObserver(updateLayout);
    layoutObserver.observe(document.querySelector('.content-page'));
    layoutObserver.observe(frame);
    layoutObserver.observe(directory);
    window.addEventListener('resize', updateLayout);
    document.fonts.ready.then(updateLayout);
    updateLayout();
    renderPage(0);
  </script>
</body>
</html>
