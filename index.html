<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content</title>
  <link rel="stylesheet" href="fonts/abc-rom.css">
  <style>
    @font-face {
      font-family: "A-side Inside I";
      src: url("fonts/A-sideInsideI.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "A-side Inside II";
      src: url("fonts/A-sideInsideII.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: "ABC ROM", sans-serif;
      font-weight: 500;
    }

    .content-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      min-height: max(100svh, 376px);
    }

    .circles {
      position: absolute;
      top: 32px;
      left: 32px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
      transform:;
      transform-origin: top left;
      z-index: 3;
    }

    .content-item {
      position: relative;
    }

    .item-label {
      font-weight: 500;
      text-align: left;
      font-size: 24px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .numbered-label {
      display: grid;
      grid-template-columns: 1ch auto;
      column-gap: 0.75em;
    }

    .circle {
      display: block;
      width: 17px;
      height: 17px;
      border: 2px solid #000;
      border-radius: 50%;
    }

    .corner-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 850px;
      background: transparent;

    }

    .frame-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 0 solid #000;
    }

    .top-left { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .top-right { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .bottom-left { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .bottom-right { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

    .frame-triangle {
      position: absolute;
      background: #000;
    }

    .triangle-top, .triangle-bottom {
      width: 25px;
      height: 21.650635px;
      left: 50%;
      transform: translateX(-50%);
    }

    .triangle-top {
      bottom: calc(100% + 20px);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .triangle-bottom {
      top: calc(100% + 20px);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .triangle-left, .triangle-right {
      width: 21.650635px;
      height: 25px;
      top: 50%;
      transform: translateY(-50%);
    }

    .triangle-left {
      right: calc(100% + 20px);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }

    .triangle-right {
      left: calc(100% + 20px);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    .directory-button {
      border: 0;
      padding: 0;
      background: none;
      display: grid;
      grid-template-columns: 17px auto;
      column-gap: calc(50px / 3);
      align-items: start;
    }
    .view-toggle { display: block; margin-bottom: 28.8px; }
    .directory-button .circle { margin-top: calc((24px * 1.2 - 17px) / 2); }
    .directory-button[aria-current="page"] .circle,
    .directory-button:hover .circle,
    .directory-button:focus-visible .circle { background: #000; }
    .circle { transition: background-color 150ms ease; }
    .about-page {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: white;
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateY(-100%);
      visibility: hidden;
      transition: transform 500ms ease-in-out, visibility 0s 500ms;
    }
    .about-body {
      margin-left: 25%;
      width: 75%;
      padding: 32px 32px 32px 0;
      font-family: "ABC ROM", sans-serif;
      font-weight: 500;
      font-size: 6.5vw;
      line-height: 1;
      overflow-wrap: break-word;
      -webkit-hyphens: none;
      hyphens: none;
    }
    .about-body p { margin: 0 0 0.5em; }
    .about-body p:last-child { margin-bottom: 0; }
    .content-page.is-about .about-page {
      transform: translateY(0);
      visibility: visible;
      transition-delay: 0s;
    }
    .content-page.is-about .section-entry { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) {
      .about-page, .circle { transition: none; }
    }
    .frame-triangle { border: 0; padding: 0; }
    .frame-triangle:disabled { opacity: .2; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 2px solid #777; outline-offset: 5px; }
    .page-viewport { position: absolute; inset: 0; overflow: hidden; }
    .page-sheet { position: absolute; inset: 0; }
    .page-content { position: absolute; inset: 0; background: transparent; height: 100%; padding: clamp(20px, 5vw, 56px) 10px; overflow: auto; display: flex; flex-direction: column; }
    .unicode-intro { margin: 0; font-size: 36px; line-height: 1.2; font-weight: 400; color: #000; }
    .more-info { margin-top: 1.2em; padding-top: 0; flex-shrink: 0; font-size: 36px; line-height: 1.2; font-weight: 400; color: #000; overflow-wrap: anywhere; }
    .more-info[hidden] { display: none; }
    .more-info a { color: #000; }
    .corner-frame { container-type: inline-size; }
    .page-content.is-character-table { padding: 32px 10px 10px; overflow: hidden; background: transparent; }
    .is-character-table .page-body { height: 100%; min-height: 0; }
    .character-chart { height: 100%; display: flex; flex-direction: column; font-weight: 400; background: transparent; }
    .character-table { width: 100%; height: 100%; table-layout: fixed; border-collapse: collapse; }
    .character-table tr { height: calc(100% / 19); }
    .character-table td { border: 0; padding: 0; vertical-align: middle; }
    .character-cell { display: flex; align-items: center; justify-content: center; gap: 1cqw; padding: 0.35cqw; white-space: nowrap; }
    .character-glyph { font-size: 6cqw; line-height: 1; text-align: center; flex: 0 0 1.2em; }
    .character-code { font-size: 1.8cqw; line-height: 1; color: #999; font-variant-numeric: tabular-nums; flex: 0 0 4ch; }
    .self-alphanumeric:not(.self-font-comparison) .character-code { font-size: 2.16cqw; }
    .self-alphanumeric .character-table tr { height: calc(100% / 13); }
    .self-font-comparison .character-glyph { font-family: "A-side Inside I"; font-size: 6.25cqw; font-weight: 400; order: 2; color: #999; }
    .self-font-comparison .character-code { font-size: 4.05cqw; flex-basis: 1.2ch; order: 1; color: #000; }
    .page-content.is-self-process { padding: 32px 10px 10px; overflow: hidden; }
    .is-self-process .page-body { height: 100%; min-height: 0; }
    .self-process { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); row-gap: 4cqw; height: 100%; font-weight: 400; color: #000; }
    .process-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 6cqw minmax(0, 1fr); align-items: center; }
    .self-process:not(.self-process-xyz) .process-row:not(:last-child)::after { content: ""; position: absolute; left: calc((100% - 6cqw) / 4); bottom: -2cqw; transform: translate(-50%, 50%); width: 3.6cqw; height: 2.7cqw; background: #999; clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .self-process:not(.self-process-xyz) .process-row:nth-child(3)::after { display: none; }
    .self-process:not(.self-process-xyz) .process-row:nth-child(4)::before { content: ""; position: absolute; top: calc(-2cqw - 1px); left: 50%; transform: translateX(-50%); width: 75cqw; height: 2px; background: #000; }
    .process-item { display: flex; align-items: center; justify-content: center; font-size: 22cqw; line-height: 1; }
    .process-inside-i { font-family: "A-side Inside I"; }
    .process-inside-ii { font-family: "A-side Inside II"; }
    .process-digits { display: grid; grid-template-columns: repeat(2, max-content); grid-template-rows: repeat(2, max-content); gap: 0; align-items: center; justify-items: center; justify-self: center; width: max-content; height: auto; font-size: 10cqw; line-height: 1.2; }
    .process-arrow { display: block; width: 2.7cqw; height: 3.6cqw; background: #999; clip-path: polygon(0 0, 100% 50%, 0 100%); justify-self: center; }
    .self-process-xyz { grid-template-rows: repeat(3, minmax(0, 1fr)); row-gap: 0; }
    .self-process-xyz .process-row::before { display: none; }
    .self-derivation { width: calc(100% - 40px); margin-inline: auto; display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); height: 100%; color: #000; font-weight: 400; }
    .derivation-row { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; }
    .derivation-glyph { display: flex; align-items: center; justify-content: flex-start; padding-left: 20px; font-size: 18cqw; line-height: 1; }
    .derivation-row:nth-child(-n+2) .derivation-glyph { font-size: 13.5cqw; }
    .derivation-row:nth-child(n+3) .derivation-glyph { font-size: 22.5cqw; }
    .derivation-label { text-align: left; font-size: 3.2cqw; line-height: 1.15; }
    .derivation-row:not(:last-child)::after { content: ""; position: absolute; left: var(--derivation-arrow-x, 8cqw); bottom: 0; transform: translate(-50%, 50%); width: 3.6cqw; height: 2.7cqw; background: #999; clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .self-nested { height: 100%; display: flex; align-items: center; justify-content: center; font-family: "ABC ROM", sans-serif; font-weight: 400; }
    .nested-box { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); border: var(--nested-stroke) solid #000; padding: var(--nested-space); gap: var(--nested-space); min-width: 0; min-height: 0; }
    .nested-root { width: 90cqw; height: 104.4cqw; }
    .nested-digit { display: block; min-width: 0; min-height: 0; }
    .nested-digit svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .nested-digit text { font-family: "A-side Inside I"; font-size: 100px; font-weight: 400; fill: #000; }
    .self-poster { height: 100%; color: #000; font-family: "ABC ROM", sans-serif; font-weight: 400; }
    .message-poster { display: grid; grid-template-rows: repeat(5, 0.9em); align-content: start; font-size: 19cqw; line-height: 0.9; }
    .poster-line { display: flex; align-items: center; white-space: nowrap; }
    .poster-inside-i { font-family: "A-side Inside I"; }
    .poster-inside-ii { font-family: "A-side Inside II"; }
    .message-poster-i { font-size: 18cqw; }
    @font-face { font-family: "IDS"; src: url("fonts/IDS.otf") format("opentype"); font-weight: 400; font-style: normal; }
    .ids-description { height: 100%; display: flex; flex-direction: column; font-family: "ABC ROM", sans-serif; font-size: 3cqw; font-weight: 400; line-height: 1.1; }
    .ids-description p { margin: 0 0 1em; }
    .ids-description-title { font-size: inherit; }
    .ids-description-list { flex: 1; display: grid; grid-template-rows: repeat(12, 1fr); }
    .ids-description-row { display: grid; grid-template-columns: 20% 30% 50%; gap: 0; align-items: center; }
    .ids-description-symbol { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: inherit; }
    .ids-description-row > span:nth-child(2) { text-align: center; justify-self: center; transform: translateX(-70px); }
    .ids-description-row > span:nth-child(3) { padding-left: 0; }
    .ids-description > p { margin-left: 50%; font-size: inherit; }
    .ids-half { overflow: hidden !important; }
    @font-face { font-family: "Hanyi Qihei"; src: url("fonts/Hanyi-Qihei-Book.otf") format("opentype"); font-weight: 400; }
    .ids-examples { height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 2cqw 4cqw; }
    .ids-examples-lined .ids-example { width: 80%; justify-self: center; padding-bottom: 1cqw; }
    .ids-examples-lined .ids-example:nth-last-child(2)::after { display: none; }
    .ids-examples-lined { column-gap: 0; position: relative; }
    .ids-examples-lined .ids-example:nth-child(odd) { position: relative; }
    .ids-examples-lined .ids-example:nth-child(odd)::after { content: ""; position: absolute; left: -12.5%; width: 250%; height: 1px; background: #ddd; bottom: 0; }
    .ids-flow { height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; }
    .draft-chart { height: 100%; display: grid; grid-template-rows: repeat(5, 1fr); font-family: "ABC ROM", "Hanyi Qihei", sans-serif; font-weight: 400; }
    .draft-row { display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
    .draft-original { font-size: 16cqw; }
    .draft-result { display: flex; flex-direction: column; align-items: flex-start; font-size: 12cqw; line-height: 1; }
    .draft-code { font-size: 3cqw; line-height: 1; white-space: nowrap; }
    .draft-badge { width: 14cqw; height: 14cqw; display: flex; align-items: center; justify-content: center; border: 1px solid #000; border-radius: 50%; font-size: 3cqw; }
    .draft-badge.filled { background: #000; color: #fff; }
    .draft-badge.double { outline: 1px solid #000; outline-offset: 3px; }
    .draft-badge.square { border-radius: 1.5cqw; }
    .draft-scribble { width: 14cqw; height: 10cqw; fill: none; stroke: #000; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .draft-alternate { display: flex; align-items: flex-end; position: relative; padding-left: 2cqw; }
    .draft-alternate .draft-code { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 2cqw; position: absolute; left: 0; bottom: var(--code-bottom, 0px); line-height: 1; }
    .draft-alternate .alternate-glyph { font-size: 16cqw; line-height: 1; }
    .ids-example { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 1cqw; align-items: center; font-family: "ABC ROM", "Hanyi Qihei", sans-serif; font-weight: 400; font-size: 6cqw; line-height: 1; }
    .ids-components { display: flex; justify-content: space-between; align-items: center; min-width: 0; }
    .ids-example span { white-space: nowrap; }
    .ids-operator { width: 1em; height: 1em; fill: none; stroke: black; stroke-width: 3; stroke-dasharray: 8 6; }
    .ids-flow { font-family: "IDS"; font-weight: 400; font-size: 9cqw; line-height: 1; letter-spacing: normal; text-align: left; }
    .ids-justified { position: relative; display: block; font-size: 9cqw; line-height: 1; padding: 0; }
    .ids-justified > div { text-align: justify; text-align-last: justify; }
    .ids-justified > .ids-letter-row { display: flex; justify-content: space-between; }
    .ids-justified > .ids-specimen-label { position: absolute; top: 66.666%; left: 0; text-align: left; text-align-last: left; font-size: 9cqw; }
    .ids-flow > div { min-height: 1em; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ids-specimen { display: block; width: 100%; height: 100%; overflow: visible; }
    .page-content.is-ids-page { padding: 32px 10px 10px; overflow: hidden; }
    .is-ids-page .page-body { height: 100%; min-height: 0; }
    .ids-intro { font-family: "ABC ROM", sans-serif; font-weight: 400; font-size: 36px; line-height: 1.2; }
    .ids-intro h2 { font-size: inherit; font-weight: 400; margin: 0 0 1em; }
    .ids-intro p { margin: 0 0 1em; }
    .ids-intro img { display: block; width: 100%; height: auto; }
    .design-credit { position: fixed; left: 32px; bottom: 24px; z-index: 4; margin: 0; font-family: "ABC ROM", sans-serif; font-size: 14px; font-weight: 400; }
    .hex-demonstration { height: calc(100% - 10px); margin-top: 10px; display: flex; flex-direction: column; justify-content: flex-start; gap: 4cqw; font-family: "ABC ROM", sans-serif; font-weight: 400; font-size: 11cqw; line-height: 1; }
    .hex-equation { display: grid; grid-template-columns: 7ch 1ch 1fr; gap: 2cqw; align-items: center; text-align: left; }
    .hex-poster-image { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
    .hex-caption { margin: 0 0 0.25cqw; font-size: 3cqw; line-height: 1.2; color: #999; }
    .hex-arrow { width: 3.6cqw; height: 2.7cqw; flex-shrink: 0; background: #999; clip-path: polygon(0 0, 100% 0, 50% 100%); margin: 1cqw 0 1cqw; position: relative; left: 0.335em; transform: translateX(-50%); }
    .hex-swatch { display: block; width: 12cqw; height: 12cqw; background: #000041; }
    .frame-pagination { font-family: "ABC ROM", sans-serif; font-weight: 400; font-variant-numeric: normal; position: absolute; left: 10px; top: 10px; margin: 0; font-size: 18px; line-height: 1; display: flex; gap: 0; }
    .page-number-window { position: relative; display: inline-block; width: 1ch; height: 1em; overflow: hidden; color: #999; }
    .page-number-window span { position: absolute; inset: 0; }
    .page-body { position: relative; flex-shrink: 0; }
    .corner-frame {
      width: min(650px, calc(100vw - 120px), calc((100svh - 120px) * 650 / 850));
      height: auto;
      aspect-ratio: 650 / 850;
    }
    .content-page { min-height: max(100svh, 360px); }
    .circles.is-obscured .section-entry { visibility: hidden; }
    .section-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "ABC ROM", sans-serif;
      font-weight: 500;
      font-size: var(--section-number-size);
      line-height: 1;
      color: #bfbfbf;
      opacity: 0.25;
      pointer-events: none;
    }
    .section-number { transform: translateY(calc(100% / 30)); }
    .section-number[data-number="1"] { transform: translate(-5%, calc(100% / 30)); }
    @media (max-height: 359px) {
      .corner-frame { width: min(650px, calc(100vw - 120px), 183px); }
    }

    [hidden] { display: none !important; }
    .project-grid { position: absolute; top: 0; left: 0; width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; padding: 270px 32px 60px; }
    .project-grid .corner-frame, .unicode-panel .corner-frame { position: relative; left: auto; top: auto; transform: none; width: 100%; max-width: 650px; }
    .project-grid .corner-frame:focus-visible { outline: 1px solid #999; outline-offset: 8px; }
    .unicode-panel { position: absolute; top: 0; left: 0; width: 100%; padding: 210px 60px 60px; }
    .unicode-panel .corner-frame { margin: 0 auto; }
    .about-page { position: absolute; top: 0; left: 0; width: 100%; min-height: 100svh; transform: none; visibility: visible; transition: none; }
    .about-body { padding-top: 210px; }
    .view-toggle { margin-bottom: 0; }
    .unicode-toggle { display: block; margin-bottom: 28.8px; }
    .content-page[data-view="website"] .section-entry, .content-page[data-view="unicode"] .section-entry { display: none; }
    .corner-frame .unicode-intro, .corner-frame .more-info, .corner-frame .ids-intro { font-size: 5.54cqw; }
    .frame-pagination { font-size: clamp(12px, 2.77cqw, 18px); }
    .corner-frame .page-content { padding-top: 32px; }

    .view-toggle, .unicode-toggle { margin: 0; }
    .directory-button .item-label { font-size: 24px; }

    .about-body { padding-top: 24px; }
    .unicode-panel { padding: 0; }

    /* Responsive changes affect the arrangement, not the frame's aspect ratio. */

<template id="project-frame">    <div class="corner-frame">
      <div class="page-viewport">

      </div>
      </div>
      <span class="frame-corner top-left"></span>
      <span class="frame-corner top-right"></span>
      <span class="frame-corner bottom-left"></span>
      <span class="frame-corner bottom-right"></span>
      <button class="frame-triangle triangle-top" data-step="-1" aria-label="Previous page"></button>

<script>
    const titles = ['1 Unicode', '2 _Self', '3 _Hexadecimal Code', '4 _Ideographic Description Symbols', '5 _ Drafts'];
    // Replace each empty string with the content for that section's slide.
    const sections = titles.map(title => ({ title, slides: ['', ''] }));
    const hexPosterImages = ["assets/hex-posters/poster-1.jpg", "assets/hex-posters/poster-2.jpg", "assets/hex-posters/poster-3.jpg", "assets/hex-posters/poster-4.jpg", "assets/hex-posters/poster-5.jpg", "assets/hex-posters/poster-6.jpg"];
    sections[2].slides.push(...hexPosterImages.map(() => ''));
    sections[4].slides = Array(4).fill('');
    sections[3].slides = Array(10).fill('');
    sections[0].slides.push('');
    sections[1].slides.push(...Array(8).fill(''));
    function buildNestedCharacter(character, level, depth = 0) {
      if (level === 1) {
        const digit = document.createElement('span');
        digit.className = 'nested-digit';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('preserveAspectRatio', 'none');
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.textContent = character;
        svg.append(text);
        digit.append(svg);
        return digit;
      }
      const box = document.createElement('div');
      box.className = 'nested-box';
      const code = character.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
      for (const digit of code) box.append(buildNestedCharacter(digit, level - 1, depth + 1));
      return box;
    }
    function layoutNestedCharacters(frame) {
      const wrapper = frame.querySelector('.self-nested');
      if (!wrapper) return;
      const root = wrapper.querySelector('.nested-root');
      const level = Number(root.dataset.level);
      const context = document.createElement('canvas').getContext('2d');
      const glyphMetrics = new Map();
      context.font = '400 100px "A-side Inside I"';
      const measure = context.measureText('0');
      const glyphWidth = measure.actualBoundingBoxLeft + measure.actualBoundingBoxRight;
      const glyphHeight = measure.actualBoundingBoxAscent + measure.actualBoundingBoxDescent;
      if (!glyphWidth || !glyphHeight) return;
      const units = 2 ** (level - 1);
      const frameWidth = frame.getBoundingClientRect().width;
      let space = frameWidth * 0.014 / (2 ** (level - 3));
      const stroke = 6 - level;
      let width = Math.min(frameWidth * 0.9, wrapper.clientWidth);
      // Each two-by-two box adds two borders and three identical gaps.
      const leafWidth = (width - (units - 1) * (3 * space + 2 * stroke)) / units;
      let height = units * leafWidth * glyphHeight / glyphWidth + (units - 1) * (3 * space + 2 * stroke);
      const scale = Math.min(1, wrapper.clientHeight * 0.96 / height);
      width *= scale;
      height *= scale;
      space *= scale;
      height = (width - (units - 1) * (3 * space + 2 * stroke)) * glyphHeight / glyphWidth + (units - 1) * (3 * space + 2 * stroke);
      root.style.width = `${width}px`;
      root.style.height = `${height}px`;
      root.style.setProperty('--nested-space', `${space}px`);
      root.style.setProperty('--nested-stroke', `${stroke}px`);
      wrapper.querySelectorAll('.nested-digit svg').forEach(svg => {
        if (svg.dataset.measured === 'true') return;
        let metrics = glyphMetrics.get(svg.textContent);
        if (!metrics) { metrics = context.measureText(svg.textContent); glyphMetrics.set(svg.textContent, metrics); }
        svg.dataset.measured = 'true';
        svg.setAttribute('viewBox', `${-metrics.actualBoundingBoxLeft} ${-metrics.actualBoundingBoxAscent} ${metrics.actualBoundingBoxLeft + metrics.actualBoundingBoxRight} ${metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent}`);
      });
    }
    function alignDraftCodes(frame) {
      const items = frame.querySelectorAll('.draft-alternate');
      if (!items.length) return;
      const canvas = document.createElement('canvas').getContext('2d');
      items.forEach(item => {
        const glyph = item.querySelector('.alternate-glyph');
        const style = getComputedStyle(glyph);
        canvas.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
        const metrics = canvas.measureText(glyph.textContent);
        const height = glyph.getBoundingClientRect().height;
        const ascent = metrics.fontBoundingBoxAscent ?? metrics.actualBoundingBoxAscent;
        const descent = metrics.fontBoundingBoxDescent ?? metrics.actualBoundingBoxDescent;
        const baseline = (height - ascent - descent) / 2 + ascent;
        item.style.setProperty('--code-bottom', `${height - baseline - metrics.actualBoundingBoxDescent}px`);
      });
    }
    function alignDerivationArrows(frame) {
      const chart = frame.querySelector('.self-derivation');
      const original = frame.querySelector('.derivation-original');
      if (!chart || !original) return;
      const bounds = original.getBoundingClientRect();
      chart.style.setProperty('--derivation-arrow-x', `${bounds.left + bounds.width / 2 - chart.getBoundingClientRect().left}px`);
    }
    function renderPage(frame, index, slide = 0) {
      const currentPage = Math.max(0, Math.min(titles.length - 1, index));
      const currentSlide = Math.max(0, Math.min(sections[currentPage].slides.length - 1, slide));
      const number = frame.querySelector('.section-number');
      number.textContent = currentSlide.toString(16).toUpperCase();
      number.dataset.number = currentSlide;
      const pageBody = frame.querySelector('.page-body');
      const showsIntro = currentPage === 0 && currentSlide === 0;
      const showsDraft = currentPage === 4;
      const showsIDS = currentPage === 3;
      const specimen = showsIDS && currentSlide > 2 ? currentSlide - 1 : currentSlide === 2 ? 1 : currentSlide;
      frame.dataset.specimen = specimen;
      frame.querySelector('.page-content').classList.toggle('is-ids-page', showsIDS);
      const showsHexIntro = currentPage === 2 && currentSlide === 0;
      const showsHexDemonstration = currentPage === 2 && currentSlide === 1;
      const showsHexPoster = currentPage === 2 && currentSlide >= 2;
      const showsCharacterTable = currentPage === 0 && currentSlide === 1;
      const showsExplorer = currentPage === 0 && currentSlide === 2;
      const showsSelfChart = currentPage === 1 && currentSlide === 0;
      const showsSelfComparison = currentPage === 1 && currentSlide === 1;
      const showsSelfProcess = currentPage === 1 && currentSlide === 2;
      const showsSelfXYZ = currentPage === 1 && currentSlide === 3;
      const showsSelfDerivation = currentPage === 1 && currentSlide === 4;
      const showsSelfNested = currentPage === 1 && currentSlide >= 5 && currentSlide <= 7;
      const showsSelfPoster = currentPage === 1 && currentSlide >= 8;
      frame.querySelector('.page-content').classList.toggle('is-self-process', showsSelfProcess || showsSelfXYZ || showsSelfDerivation || showsSelfNested || showsSelfPoster || showsHexDemonstration || showsHexPoster || showsDraft || (showsIDS && currentSlide > 0));
      frame.querySelector('.page-content').classList.toggle('is-character-table', showsCharacterTable || showsSelfChart || showsSelfComparison);
      pageBody.replaceChildren();
      if (showsIntro) pageBody.append(document.getElementById('unicode-intro').content.cloneNode(true));
      else if (showsDraft) pageBody.append(document.getElementById(`draft-page-${currentSlide}`).content.cloneNode(true));
      else if (showsIDS) pageBody.append(document.getElementById(currentSlide === 2 ? 'ids-description-continuation' : `ids-page-${specimen}`).content.cloneNode(true));
      else if (showsHexPoster) {
        const image = document.createElement('img');
        image.className = 'hex-poster-image';
        image.src = hexPosterImages[currentSlide - 2];
        image.alt = `Windows poster study ${currentSlide - 1}`;
        image.tabIndex = 0;
        image.setAttribute('role', 'button');
        image.setAttribute('aria-label', 'Enlarge poster');
        image.addEventListener('click', () => openPoster(image));
        image.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openPoster(image); } });
        pageBody.append(image);
      }
      else if (showsHexDemonstration) pageBody.append(document.getElementById('hex-demonstration').content.cloneNode(true));
      else if (showsHexIntro) pageBody.append(document.getElementById('hex-intro').content.cloneNode(true));
      else if (showsCharacterTable) pageBody.append(document.getElementById('unicode-character-chart').content.cloneNode(true));
      else if (showsSelfChart) pageBody.append(document.getElementById('self-character-chart').content.cloneNode(true));
      else if (showsSelfComparison) pageBody.append(document.getElementById('self-font-comparison').content.cloneNode(true));
      else if (showsSelfProcess) pageBody.append(document.getElementById('self-process').content.cloneNode(true));
      else if (showsSelfXYZ) pageBody.append(document.getElementById('self-xyz').content.cloneNode(true));
      else if (showsSelfDerivation) pageBody.append(document.getElementById('self-derivation').content.cloneNode(true));
      else if (showsSelfNested) {
        const level = currentSlide - 2;
        const wrapper = document.createElement('div');
        wrapper.className = 'self-nested';
        wrapper.setAttribute('aria-label', `Character A, level ${level} nesting`);
        const root = buildNestedCharacter('A', level);
        root.classList.add('nested-root');
        root.setAttribute('aria-hidden', 'true');
        root.dataset.level = level;
        root.style.setProperty('--nested-stroke', `${6 - level}px`);
        wrapper.append(root);
        pageBody.append(wrapper);
      }
      else if (showsSelfPoster) {
        const posters = ['self-message-ii', 'self-message-i'];
        pageBody.append(document.getElementById(posters[currentSlide - 8]).content.cloneNode(true));
      }
      else if (showsExplorer) {
        const paragraph = document.createElement('p');
        paragraph.className = 'unicode-intro';
        paragraph.append('Explore more:', document.createElement('br'));
        const link = document.createElement('a');
        link.href = 'https://unicode-explorer.com';
        link.textContent = 'https://unicode-explorer.com';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.style.color = '#000';
        paragraph.append(link);
        pageBody.append(paragraph);
      }
      else pageBody.textContent = sections[currentPage].slides[currentSlide];
      frame.querySelector('.more-info').hidden = !showsIntro;
      frame.querySelector('.page-content').setAttribute('aria-label', `${titles[currentPage]}, content ${currentSlide + 1}`);
      frame.querySelector('.page-content').scrollTop = 0;
      alignDraftCodes(frame);
      alignDerivationArrows(frame);
      layoutNestedCharacters(frame);
      frame.dataset.section = currentPage;
      frame.dataset.slide = currentSlide;
      updateUnicodeResult();
      frame.querySelectorAll('[data-step]').forEach(button => {
        button.disabled = false;
      });
    }
    const main = document.querySelector('.content-page');
    const grid = document.querySelector('.project-grid');
    const unicodePanel = document.querySelector('.unicode-panel');
    const about = document.querySelector('.about-page');
    const directory = document.querySelector('.circles');
    const websiteToggle = document.querySelector('.view-toggle');
    const unicodeToggle = document.querySelector('.unicode-toggle');
    let view = 'content';
    let viewTurning = false;
    let activeFrame;
    const frames = [];
    function createFrame(section, parent) {
      const frame = document.getElementById('project-frame').content.firstElementChild.cloneNode(true);
      parent.append(frame);
      const caption = document.createElement('p');
      caption.className = 'project-caption';
      caption.textContent = ['Self', 'Hexadecimal', 'Ideographic Description Characters', '*Drafts'][section - 1];
      frame.append(caption);
      frame.tabIndex = 0;
      frame.setAttribute('aria-label', titles[section]);
      frame.addEventListener('pointerenter', () => activeFrame = frame);
      frame.addEventListener('focusin', () => activeFrame = frame);
      let wheelTotal = 0;
      let lastWheel = 0;
      frame.addEventListener('wheel', event => {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        event.preventDefault();
        if (frame.dataset.turning === 'true') { wheelTotal = 0; return; }
        if (performance.now() - lastWheel > 200) wheelTotal = 0;
        lastWheel = performance.now();
        wheelTotal += event.deltaY;
        if (Math.abs(wheelTotal) > 60) { turnFrame(frame, Math.sign(wheelTotal)); wheelTotal = 0; }
      }, {passive: false});
      let touchStart;
      frame.addEventListener('touchstart', event => touchStart = event.touches[0].clientY, {passive:true});
      frame.addEventListener('touchend', event => {
        if (touchStart === undefined) return;
        const distance = touchStart - event.changedTouches[0].clientY;
        if (Math.abs(distance) > 40) turnFrame(frame, Math.sign(distance));
        touchStart = undefined;
      }, {passive:true});
      frame.querySelectorAll('[data-step]').forEach(button => button.addEventListener('click', () => turnFrame(frame, Number(button.dataset.step))));
      frames.push(frame);
      renderPage(frame, section);
      return frame;
    }
    for (let section = 1; section <= 4; section++) createFrame(section, grid);
    const unicodeBody = document.createElement('div');
    unicodeBody.className = 'about-body unicode-body';
    unicodeBody.append(document.getElementById('unicode-intro').content.cloneNode(true));
    const moreInfo = document.createElement('p');
    moreInfo.innerHTML = 'More Info:<br><a href="https://en.wikipedia.org/wiki/Unicode" target="_blank" rel="noopener noreferrer">https://en.wikipedia.org/wiki/Unicode</a>';
    unicodeBody.append(moreInfo);
    const table = document.createElement('div');
    table.className = 'unicode-alphabet';
    table.append(document.getElementById('unicode-character-chart').content.cloneNode(true));
    unicodeBody.append(table);
    const explore = document.createElement('p');
    explore.innerHTML = 'Explore more:<br><a href="https://unicode-explorer.com" target="_blank" rel="noopener noreferrer">https://unicode-explorer.com</a>';
    unicodeBody.append(explore);
    unicodePanel.append(unicodeBody);
    activeFrame = frames[0];
    async function turnFrame(frame, step) {
      if (frame.dataset.turning === 'true' || viewTurning) return;
      const section = Number(frame.dataset.section);
      const slide = Number(frame.dataset.slide);
      const count = sections[section].slides.length;
      const next = (slide + step + count) % count;
      if (next === slide) return;
      const page = frame.querySelector('.page-sheet');
      const outgoing = page.cloneNode(true);
      outgoing.inert = true;
      outgoing.setAttribute('aria-hidden', 'true');
      page.parentElement.append(outgoing);
      frame.dataset.turning = 'true';
      renderPage(frame, section, next);
      const animations = [];
      page.style.willChange = outgoing.style.willChange = 'transform';
      try {
        const image = page.querySelector('.hex-poster-image');
        if (image) await image.decode().catch(() => {});
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const options = { duration: 550, easing: 'ease-in-out', fill: 'both' };
          animations.push(outgoing.animate([{transform:'translateY(0)'},{transform:`translateY(${-step * 100}%)`}],options));
          animations.push(page.animate([{transform:`translateY(${step * 100}%)`},{transform:'translateY(0)'}],options));
          await Promise.all(animations.map(animation => animation.finished));
        }
      } finally {
        outgoing.remove();
        animations.forEach(animation => animation.cancel());
        page.style.willChange = '';
        frame.dataset.turning = 'false';
      }
    }
    const posterDialog = document.createElement('dialog');
    posterDialog.className = 'poster-lightbox';
    posterDialog.innerHTML = '<img alt="">';
    posterDialog.setAttribute('aria-label', 'Enlarged poster. Click anywhere to close.');
    document.body.append(posterDialog);
    posterDialog.onclick = () => posterDialog.close();
    function openPoster(image) { const enlarged = posterDialog.querySelector('img'); enlarged.src = image.src; enlarged.alt = image.alt; posterDialog.showModal(); }
    function surface(name) { return name === 'website' ? about : name === 'unicode' ? unicodePanel : grid; }
    async function switchView(next) {
      if (viewTurning || next === view) return;
      const previous = view;
      const outgoing = surface(previous);
      const incoming = surface(next);
      viewTurning = true;
      incoming.hidden = false;
      incoming.inert = false;
      incoming.setAttribute('aria-hidden', 'false');
      outgoing.inert = true;
      websiteToggle.querySelector('.item-label').textContent = next === 'content' ? 'About' : 'Content';
      unicodeToggle.closest('li').hidden = next !== 'content';
      unicodeToggle.querySelector('.item-label').textContent = next === 'unicode' ? 'Content' : 'Unicode';
      websiteToggle.setAttribute('aria-expanded', String(next === 'website'));
      unicodeToggle.setAttribute('aria-expanded', String(next === 'unicode'));
      view = next;
      main.dataset.view = next;
      document.querySelector('.unicode-result').hidden = next !== 'content';
      const animations = [];
      try {
        updateLayout();
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const options = { duration: 550, easing: 'ease-in-out', fill: 'both' };
          const direction = next === 'content' ? 1 : -1;
          animations.push(incoming.animate([{transform:`translateY(${direction * 100}svh)`},{transform:'translateY(0)'}],options));
          animations.push(outgoing.animate([{transform:'translateY(0)'},{transform:`translateY(${-direction * 100}svh)`}],options));
          await Promise.all(animations.map(animation => animation.finished));
        }
      } finally {
        outgoing.hidden = true;
        outgoing.setAttribute('aria-hidden', 'true');

        animations.forEach(animation => animation.cancel());
        viewTurning = false;
        updateLayout();
      }
    }
    about.hidden = true;
    websiteToggle.addEventListener('click', () => switchView(view === 'content' ? 'website' : 'content'));
    unicodeToggle.addEventListener('click', () => switchView(view === 'unicode' ? 'content' : 'unicode'));
    document.addEventListener('keydown', event => {
      if (view !== 'content' || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        event.preventDefault();
        turnFrame(activeFrame, event.key === 'ArrowUp' ? -1 : 1);
      }
    });
    function updateUnicodeResult() {
      const projectFrames = frames.filter(frame => Number(frame.dataset.section) > 0);
      if (projectFrames.length !== 4) return;
      const digits = projectFrames.map(frame => Number(frame.dataset.slide || 0).toString(16).toUpperCase()).join('');
      const code = parseInt(digits, 16);
      const glyph = document.querySelector('.unicode-result-glyph');
      const output = document.querySelector('.unicode-result');
      const character = String.fromCodePoint(code);
      glyph.textContent = code < 32 ? String.fromCodePoint(0x2400 + code) : code === 32 ? '␠' : code === 127 ? '␡' : character;
      document.querySelector('.unicode-result-code').textContent = `U+${digits}`;
      output.setAttribute('aria-label', `Unicode U+${digits}${code < 32 ? ', control character' : ''}`);
    }
    function updateLayout() {
      const columns = window.innerWidth > 1100 ? 4 : window.innerWidth > 650 ? 2 : 1;
      const rows = 4 / columns;
      const gap = 64;
      const availableWidth = document.documentElement.clientWidth - 48 - gap * (columns - 1);
      const width = Math.min(650, availableWidth / columns);
      grid.style.setProperty('--frame-width', `${width}px`);
      grid.style.setProperty('--frame-columns', columns);
      grid.classList.toggle('single-column', columns === 1);
      main.style.minHeight = `${view === 'content' ? Math.max(window.innerHeight, 400 + rows * width * 850 / 650 + (rows - 1) * 96) : Math.max(window.innerHeight, surface(view).scrollHeight)}px`;
      frames.forEach(frame => {
        if (frame.closest('[hidden]')) return;
        const frameWidth = frame.getBoundingClientRect().width;
        const layoutKey = `${frameWidth}:${frame.dataset.section}:${frame.dataset.slide}`;
        if (frame.dataset.layoutKey === layoutKey) return;
        frame.dataset.layoutKey = layoutKey;
        frame.style.setProperty('--section-number-size', `${frameWidth * 850 / 650 * 0.96}px`);
        alignDraftCodes(frame);
        alignDerivationArrows(frame);
        layoutNestedCharacters(frame);
      });
    }
    let layoutPending = false;
    function scheduleLayout() {
      if (layoutPending) return;
      layoutPending = true;
      requestAnimationFrame(() => { layoutPending = false; updateLayout(); });
    }
    const observer = new ResizeObserver(scheduleLayout);
    frames.forEach(frame => observer.observe(frame));
    window.addEventListener('resize', scheduleLayout);
    document.fonts.ready.then(() => {
      frames.forEach(frame => { delete frame.dataset.layoutKey; frame.querySelectorAll('[data-measured]').forEach(svg => delete svg.dataset.measured); });
      scheduleLayout();
    });
    updateLayout();
  </script>
</body>
